<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꽃피는 율산방 | 숲의 하루</title><style>html,body{margin:0;background:#182b24;color:#f7eed9;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1120px;margin:auto;padding:16px}h1{font-size:26px;margin:3px 0}p{margin:5px 0 12px;color:#d8d5bc}.layout{display:grid;grid-template-columns:minmax(0,800px) 280px;gap:14px}canvas{display:block;width:100%;image-rendering:pixelated;background:#84ad70;border:5px solid #72523a;box-sizing:border-box;border-radius:8px}aside{background:#263e32;border:2px solid #60795c;border-radius:9px;padding:14px}button{background:#e3c989;border:2px solid #84663b;color:#26362c;border-radius:7px;padding:9px 11px;font-weight:bold;cursor:pointer;margin:3px}button:hover{background:#ffe5a0}.stat{background:#3a5744;padding:9px;border-radius:6px;margin:7px 0}.small{font-size:13px;color:#dfd8b8}#log{min-height:86px;line-height:1.55}#touch{display:flex;justify-content:center;flex-wrap:wrap;margin:10px}#touch button{min-width:55px}kbd{background:#405a46;padding:2px 5px;border-radius:3px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{order:2}} </style></head><body><main><h1>🌿 꽃피는 율산방 <small style="font-size:14px;color:#d8cba0">숲의 하루 · v3</small></h1><p>엉성한 것이 아름답습니다. 숲을 걷고, 관찰하고, 만들고, 자연에 맡겨보세요.</p><div class="layout"><div><canvas id="game" width="800" height="576" tabindex="0" aria-label="율산방 탐험 게임"></canvas><div id="touch"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button><button id="act">살펴보기 E</button></div><p class="small">이동: 방향키 / WASD · 살펴보기: E / 스페이스 · 마우스로 화면 클릭하면 해당 방향으로 이동 · 자동 저장</p></div><aside><div class="stat" id="status"></div><div class="stat" id="inventory"></div><div class="stat"><b>오늘의 발견</b><div id="log"></div></div><b>행동</b><div><button id="plant">🌱 나무 심기</button><button id="art">🪨 작품 놓기</button><button id="collect">🍃 채집하기</button><button id="next">🌅 다음 날</button></div><hr style="border-color:#58735c"><b>계절</b><div id="seasons"></div><p class="small">장소 가까이에서 E를 누르세요. 연못·목공방·아틀리에·목마·숲길·정원에서 이야기를 발견합니다.</p><button id="reset">처음부터 시작</button></aside></div></main><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=25,H=18,T=32,KEY='yulsanbang-v3-save';const seasons=['봄','여름','가을','겨울'];const palettes=[['#89bd69','#6c9e53','#b3d37c'],['#64a44d','#45843e','#83b85d'],['#c8a057','#aa793d','#dfb76c'],['#d6e0df','#c0d2d3','#edf1e9']];let s={x:12,y:14,day:1,season:0,wood:4,stone:3,seeds:5,found:[],trees:[],arts:[],msg:'율산방에 오신 것을 환영합니다. 숲길을 걸어보세요.'};try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Number.isInteger(o.x)&&Array.isArray(o.trees))s={...s,...o}}catch(e){}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};const water=(x,y)=>((x-5)**2/15+(y-7)**2/8<1.3);const house=(x,y)=>x>=16&&x<=21&&y>=4&&y<=7;const shop=(x,y)=>x>=3&&x<=7&&y>=12&&y<=15;const path=(x,y)=>Math.abs(x-12)<=1&&y>=7||Math.abs(y-10)<=1&&x>=5&&x<=19||x>=18&&x<=19&&y>=7&&y<=12;const places=[{x:18,y:8,name:'아틀리에',line:'그림과 삶의 경계가 흐려지는 곳. 창밖의 풍경도 작품입니다.'},{x:5,y:11,name:'목공방',line:'나무의 결을 따라 만들다 보면 예상하지 못한 형상이 나타납니다.'},{x:8,y:7,name:'연못',line:'물 위에 빛이 머물고 올챙이가 계절을 배웁니다.'},{x:12,y:5,name:'쪽동백길',line:'길은 목적지보다 걷는 시간을 오래 기억합니다.'},{x:20,y:13,name:'자연미술 정원',line:'돌 하나, 부러진 가지 하나도 제자리를 만나면 작품이 됩니다.'},{x:10,y:13,name:'낡은 목마',line:'목마의 꼬리가 부러졌습니다. 낡아가는 시간도 작품의 일부입니다.'},{x:22,y:2,name:'뒷산',line:'고라니가 지나간 자리에서 숲은 다시 조용해집니다.'},{x:3,y:3,name:'숲의 가장자리',line:'버섯과 이끼는 아무도 지시하지 않았지만 자랍니다.'}];function rand(x,y,k=0){let n=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return n-Math.floor(n)}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function txt(t,x,y,color='#243a2a',size=12){ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#fff5d8';ctx.fillText(t,x+1,y+1);ctx.fillStyle=color;ctx.fillText(t,x,y)}function tree(x,y,age=5){const a=age>2?1:0.7;let X=x*T,Y=y*T;rect(X+14,Y+13,6,19,'#77543a');circle(X+16,Y+11,12*a,s.season===2?'#bd7739':s.season===3?'#dfe7e1':'#346e3e');circle(X+9,Y+8,8*a,s.season===2?'#dfaa4b':s.season===3?'#f4f4ef':'#4b9251');circle(X+22,Y+7,7*a,s.season===2?'#9f5434':s.season===3?'#e6edeb':'#5ba55b')}function blocked(x,y){return x<0||y<0||x>=W||y>=H||water(x,y)||house(x,y)||shop(x,y)}function draw(){let p=palettes[s.season];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let X=x*T,Y=y*T;rect(X,Y,T,T,p[rand(x,y)>0.55?0:2]);if(path(x,y))rect(X,Y,T,T,s.season===3?'#d9d4c7':'#c9ad7d');else if(rand(x,y,1)>.87){rect(X+7,Y+9,3,4,s.season===2?'#a56732':'#427e46');rect(X+18,Y+22,2,3,'#688d4b')}if(water(x,y)){rect(X,Y,T,T,'#65a9ac');rect(X+5,Y+11,15,2,'#a8d4c5');if(rand(x,y,2)>.8)circle(X+21,Y+19,4,'#9cbf77')}}for(let y=0;y<H;y++)for(let x=0;x<W;x++){if((y<4||x<3||x>22)&&rand(x,y,3)>.56&&!water(x,y)&&!path(x,y)&&!house(x,y))tree(x,y)}for(let a of s.trees)tree(a.x,a.y,s.day-a.day);for(let a of s.arts){circle(a.x*T+16,a.y*T+23,9,'#77786c');circle(a.x*T+16,a.y*T+15,7,'#b6b2a2');rect(a.x*T+13,a.y*T+7,6,7,'#6f6e65');if(s.day-a.day>2)circle(a.x*T+20,a.y*T+17,3,'#63935c')}function building(x,y,w,h,roof,wall,label){rect(x*T+3,y*T+10,w*T-6,h*T-12,wall);rect(x*T+9,y*T+20,18,19,'#564532');rect(x*T+36,y*T+18,20,16,'#9dd0c8');rect(x*T-4,y*T,w*T+8,20,roof);rect(x*T,y*T-9,w*T,14,roof);txt(label,(x+w/2)*T,(y+h)*T+13,'#253629',13)}building(16,4,6,4,'#765044','#d2a77b','아틀리에');building(3,12,5,4,'#6e5940','#b99365','목공방');rect(10*T+8,13*T+3,20,7,'#936d42');rect(10*T+14,13*T-9,7,24,'#a78153');txt('목마',10*T+16,14*T+13);for(let a of places){if(a.name==='자연미술 정원'){circle(a.x*T+12,a.y*T+12,10,'#85867c');circle(a.x*T+17,a.y*T+5,7,'#a8a99a')}if(a.name==='뒷산')txt('🦌',a.x*T+16,a.y*T+24,'#fff',23)}const px=s.x*T+16,py=s.y*T+16;circle(px,py+11,9,'#3c4b40');circle(px,py-1,11,'#f1c37d');ctx.fillStyle='#f1c37d';ctx.beginPath();ctx.moveTo(px-9,py-7);ctx.lineTo(px-9,py-20);ctx.lineTo(px-1,py-11);ctx.moveTo(px+9,py-7);ctx.lineTo(px+9,py-20);ctx.lineTo(px+1,py-11);ctx.fill();circle(px-4,py,2,'#243b30');circle(px+4,py,2,'#243b30');circle(px,py+5,2,'#bf786c');rect(0,0,800,30,'#244634');txt('꽃피는 율산방  ·  '+seasons[s.season]+'  ·  '+s.day+'일째',400,20,'#f9efd5',15);requestAnimationFrame(()=>{})}function update(){document.getElementById('status').innerHTML=`<b>🐈 날꼬양의 하루</b><br>${seasons[s.season]} · ${s.day}일째<br>발견 ${s.found.length}/${places.length}곳`;document.getElementById('inventory').innerHTML=`🌱 씨앗 ${s.seeds}　🪵 나무 ${s.wood}<br>🪨 돌 ${s.stone}　🎨 작품 ${s.arts.length}개`;document.getElementById('log').textContent=s.msg;save();draw()}function move(dx,dy){let x=s.x+dx,y=s.y+dy;if(!blocked(x,y)){s.x=x;s.y=y;s.msg='숲의 소리에 귀 기울여 보세요.'}else s.msg='이쪽은 지나갈 수 없습니다.';update()}function act(){let a=places.find(p=>Math.abs(p.x-s.x)+Math.abs(p.y-s.y)<=2);if(a){if(!s.found.includes(a.name))s.found.push(a.name);s.msg=`📖 ${a.name}: ${a.line}`}else s.msg='발밑의 작은 돌과 풀잎에도 이야기가 있습니다.';update()}function nearbyFree(){return !blocked(s.x,s.y)&&!s.trees.some(t=>t.x===s.x&&t.y===s.y)&&!s.arts.some(t=>t.x===s.x&&t.y===s.y)&&!path(s.x,s.y)}function plant(){if(s.seeds<1)s.msg='씨앗이 부족합니다. 채집해 보세요.';else if(!nearbyFree())s.msg='흙이 있는 빈 공간에서 심을 수 있습니다.';else{s.seeds--;s.trees.push({x:s.x,y:s.y,day:s.day});s.msg='작은 나무를 심었습니다. 날이 지나면 자랍니다.'}update()}function art(){if(s.stone<2||s.wood<1)s.msg='돌 2개와 나무 1개가 필요합니다.';else if(!nearbyFree())s.msg='빈 흙바닥을 찾아 작품을 놓아주세요.';else{s.stone-=2;s.wood--;s.arts.push({x:s.x,y:s.y,day:s.day});s.msg='자연미술 작품을 놓았습니다. 시간이 흐르면 이끼가 피어납니다.'}update()}function collect(){if(path(s.x,s.y)||house(s.x,s.y)||shop(s.x,s.y)){s.msg='숲이나 풀밭에서 채집해 보세요.'}else{s.seeds++;s.wood++;s.stone++;s.msg='떨어진 씨앗, 나뭇가지, 돌을 모았습니다. 살아 있는 나무는 베지 않았습니다.'}update()}function next(){s.day++;if(s.day>1&&(s.day-1)%5===0)s.season=(s.season+1)%4;s.msg='새로운 하루입니다. 자연과 작품이 조금씩 달라집니다.';update()}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','e'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')move(0,-1);else if(k==='arrowdown'||k==='s')move(0,1);else if(k==='arrowleft'||k==='a')move(-1,0);else if(k==='arrowright'||k==='d')move(1,0);else if(k==='e'||k===' ')act()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.move];move(...d)});document.getElementById('act').onclick=act;document.getElementById('plant').onclick=plant;document.getElementById('art').onclick=art;document.getElementById('collect').onclick=collect;document.getElementById('next').onclick=next;document.getElementById('reset').onclick=()=>{if(confirm('탐험 기록을 모두 지우고 처음부터 시작할까요?')){localStorage.removeItem(KEY);location.reload()}};const sea=document.getElementById('seasons');seasons.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{s.season=i;s.msg=n+'의 율산방입니다. 같은 길도 다른 얼굴을 보여줍니다.';update()};sea.appendChild(b)});c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*576/r.height;let dx=x-(s.x*T+16),dy=y-(s.y*T+16);if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))});update()})();
</script></body></html>
